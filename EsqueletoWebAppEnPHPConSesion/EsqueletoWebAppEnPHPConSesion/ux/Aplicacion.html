<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8"/>

<script src="logicaFake/diHola.js"></script>
<script src="logicaFake/hacerLogin.js"></script>

<!-- ---------------------------------------------------- -->
<script>
function botonPulsado() {

// llamo a la función de la lógica (versión fake)
diHola( function( err, res ) {
  if ( err ) {
   alert( "usuario no acreditado" )
   return
  }

  // ANTES->DESPUÉS (B8/V8): se usaba innerHTML con datos del servidor →
  //        XSS potencial si el nombre contuviera HTML/JavaScript.
  //        MOTIVO: textContent trata el texto como texto simple.
  document.getElementById("salida").textContent = res.nombre + " dice: "
  + res.saludo;
})

}
</script>

<!-- ---------------------------------------------------- -->
<script>
function loginPulsado() {

var nombre = document.getElementById("nombre").value
var password = document.getElementById("password").value

// llamo a la función de la lógica (versión fake)
hacerLogin( nombre, password, function( res ) {
  // cuando tenga el resultado lo muestro
  document.getElementById("salida").textContent = " login= " + (res.resultado || false);

  // si el login es correcto
  if ( res.resultado == true ) {
    alert(" login ok " )
  } else {
    // ANTES->DESPUÉS (B7): el alert revelaba la contraseña ("el password es: 1234").
    //        MOTIVO: nunca hay que enseñar credenciales en la interfaz.
    alert(" fallo en login" )
  }
})

}
</script>

</head>

<!-- ---------------------------------------------------- -->
<body>

<h1>Aplicación web</h1>

<form>
  usuario:<br>
  <input id="nombre" type="text" name="nombre" value="Mickey">
  <br>
  password:<br>
  <input id="password" type="password" name="password" value="Mouse">
  <br>
</form> 

<p>

<button type="buton" onclick="loginPulsado()">Log in</button>

<p>

<button type="button" onclick="botonPulsado()">Llamar hola</button>

<p id="salida">Antes</p>

</body>
</html>
